[project]
name = "global-risk-api"
version = "0.1.0"
description = "FastAPI service hosting a LangGraph application."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "rasterio>=1.4.4",
    "shapely>=2.1.2",
    "requests>=2.34.2",
    "openai>=2.43.0",
    "pyyaml>=6.0.3",
    "gdown>=6.1.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    # >=2: fastmcp 4 requires it, and mcp 2.x removed mcp.server.fastmcp.
    # An unbounded floor here is what made a routine lock refresh able to break the app.
    "mcp>=2.1",
    "google-auth>=2.35",
    "fastmcp>=4.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
