[project]
name = "global-risk-api"
version = "0.1.0"
description = "FastAPI service hosting a LangGraph application."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "rasterio>=1.4.4",
    "shapely>=2.1.2",
    "requests>=2.34.2",
    "openai>=2.43.0",
    "pyyaml>=6.0.3",
    "gdown>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
