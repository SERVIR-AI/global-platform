# DEMO: land a CSV as a citable platform-hosted series. Self-contained — works
# offline. Note the honest provenance: synthetic, unvalidated, and it says so.
dataset: btb_station_maxtemp
file: apps/web/public/runbook/samples/demo-table.csv
title: Battambang station monthly max temperature (demonstration)
description: >
  Monthly maximum temperature from a single Battambang-area station. SYNTHETIC
  DEMONSTRATION TABLE for the contribution-gate demo — not observed data.
source: platform demonstration table (synthetic)
validation: unvalidated
license: CC0-1.0
vintage: 2026-08
cadence: monthly
columns:
  month: Month
  max_temp_c: MaxTemp_C
units: degrees C
as_of_field: month
usage_notes: >
  Single-station demo series. Treat as point data — never generalize to the
  whole province, and pair with a gridded product before citing any trend.

