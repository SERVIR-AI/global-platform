[project]
name = "global-risk-platform"
version = "0.1.0"
description = "Monorepo: FastAPI + LangGraph backend and a frontend that consumes it."
requires-python = ">=3.11"
# This root package is just the workspace container; the real app lives in apps/api.
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests"]
# Silence third-party deprecations we don't control (rasterio/NumPy 2.5 and
# starlette's TestClient), matched by message so our own warnings still surface.
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
global-risk-api = { workspace = true }

[dependency-groups]
# `uv sync` installs these so you can run/lint the whole repo from the root.
dev = [
    "pytest>=9.1.1",
    "global-risk-api",
]

[tool.ruff]
# Formatting is not enforced yet (210 files differ from ruff's style); the lint gate is
# real defects only. Widen the selection one rule family at a time, fixes in the same PR.
line-length = 120
extend-exclude = ["apps/web", "cache", "MangroveData"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Test modules import fixtures by name and take them again as parameters.
"apps/api/tests/**" = ["F401", "F811"]

[tool.pyright]
include = ["apps/api/src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
