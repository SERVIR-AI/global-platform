[project]
name = "global-risk-platform"
version = "0.1.0"
description = "Monorepo: FastAPI + LangGraph backend and a frontend that consumes it."
requires-python = ">=3.11"
# This root package is just the workspace container; the real app lives in apps/api.
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests"]
# Silence third-party deprecations we don't control (rasterio/NumPy 2.5 and
# starlette's TestClient), matched by message so our own warnings still surface.
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
global-risk-api = { workspace = true }

[dependency-groups]
# `uv sync` installs these so you can run/lint the whole repo from the root.
dev = [
    "pytest>=9.1.1",
    "global-risk-api",
]
