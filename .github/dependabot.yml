# Weekly, grouped, with a three-day cooldown so a bad release is usually pulled before
# we take it. Actions bump by SHA (they are pinned by commit in the workflows), the uv
# lock and the npm lock bump as one PR each, and the Docker base images bump by digest.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      web:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # The two base images are deliberate pins (Node 22 matches .nvmrc and engines; Python 3.12
    # matches CI): Dependabot keeps their digests fresh and leaves the major version to a person.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
