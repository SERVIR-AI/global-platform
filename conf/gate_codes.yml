# Code lists the groundedness gate reads (app/food_security/synthesis.py): which bare hosts are
# country web domains, and which marks and words name a currency. Data, not code: edit it here.
# Lists of codes are space-separated strings (YAML would read a bare NO as false).

# ISO 3166-1 alpha-2, every assigned code (tzdata iso3166.tab, ISO/TC 46 N1127, 2024-02-29), and
# the exceptionally reserved codes delegated as country domains (AC, EU, SU, UK).
iso_3166_alpha2: >-
  AD AE AF AG AI AL AM AO AQ AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ BR
  BS BT BV BW BY BZ CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM DO DZ
  EC EE EG EH ER ES ET FI FJ FK FM FO FR GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GS GT GU GW
  GY HK HM HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP KE KG KH KI KM KN KP KR KW KY
  KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ MR MS MT MU MV
  MW MX MY MZ NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM PN PR PS PT PW PY
  QA RE RO RS RU RW SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TF TG
  TH TJ TK TL TM TN TO TR TT TV TW TZ UA UG UM US UY UZ VA VC VE VG VI VN VU WF WS YE YT ZA ZM
  ZW AC EU SU UK
# Codes that are common English words: never read as a country domain ('feature.id', 'data.in').
english_word_codes: AM AS AT BE BY DO ID IN IS IT ME MY NO SO TO US

# ISO 4217, every active code, with the English name of its unit; null where that name is no
# currency (metals, funds, test and accounting units) or a common English word (mark, real, sol,
