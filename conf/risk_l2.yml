# Layer-2 risk recipe: Risk = Hazard x weighted-sum(Vulnerability), all on a 1-5 scale.
#
# Inputs are already-reclassed 1-5 rasters (verified 0-5 by S1, where 0 = nodata),
# aligned onto the hazard grid (S2). No rescaling is needed: S1 confirmed every
# reclassed layer shares the 0-5 scale (the earlier "0-4" was a sampling artifact).
#
# Per cell:  V = weighted average of the vulnerability classes; a nodata vulnerability
#            cell is dropped and its weight renormalized (rule R6).
#            Risk = clip(round(Hazard * V / class_max), 1, 5).
#            nodata (0) where the hazard is nodata or every vulnerability is nodata.
# The crossing rule is implemented once in combine._combine and documented here (R2).
crossing: "clip(round(hazard * V / class_max), 1, class_max)"
class_max: 5

# Per-hazard {reclassed-vulnerability-layer: weight}; weights sum to 1.0. A starting
# flood recipe over the reclassed layers verified in S1 — to be tuned against
# risk_flood.tif in S5 (validation). Adjust freely; weights are config, not code (R7).
weights:
  flood:
    vulnerability_pop_all_total: 0.25       # population density
    vulnerability_reclass_blddensity: 0.20  # building density
    vulnerability_reclass_bldheight: 0.15   # building height
    vulnerability_reclass_road: 0.15        # distance to road
    vulnerability_reclass_tcc: 0.15         # tree-canopy cover
    vulnerability_reclass_gdp: 0.10         # GDP per capita
