# Contributed raster rows — machine-owned; written by the
# contribution gate. Hand-edit conf/tiffs.yml, never this.
hazard_heatdays:
  local_path: tiffs/hazard_heatdays.tif
  title: Extreme heat-day hazard (demonstration)
  description: 'Single-band heat-hazard raster over the Battambang area. Each pixel
    holds a heat severity class 0 (none) to 5 (extreme). SYNTHETIC DEMONSTRATION LAYER
    produced to exercise the contribution gate — not a scientific product.

    '
  legend:
    1: Very Low
    2: Low
    3: Moderate
    4: High
    5: Very High
  source: platform demonstration layer (synthetic, generated 2026-09-01)
  license: CC0-1.0
  vintage: 2026-09
  contributed: true
hazard_flood_rp10:
  local_path: tiffs/hazard_flood_rp10.tif
  title: 10-year flood hazard (Southeast Asia, JRC)
  description: Modelled river flood depth for the 10-year return period (a 10.0% chance
    in any year), reclassified from metres to the platform's 1-5 severity scale using
    the same depth bands the existing flood layer publishes. 0 = dry or no data. Clipped
    from the JRC global flood hazard maps to the Southeast Asia extent.
  legend:
    1: Very Low (0-0.5 m)
    2: Low (0.5-1 m)
    3: Moderate (1-1.5 m)
    4: High (1.5-2 m)
    5: Very High (>2 m)
  source: European Commission Joint Research Centre, global flood hazard maps, floodMapGL_rp10y,
    reclassified by depth on the platform
  license: CC-BY-4.0
  vintage: 2016-11
  usage_notes: '1 km cells: ten times coarser than hazard_flood (~100 m), so use it
    for scenario comparison, not for siting. Model output for a 10-year event, not
    an observed flood. Depth bands match hazard_flood''s legend, so classes are comparable
    across return periods. Source: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/FLOODS/GlobalMaps/floodMapGL_rp10y.zip'
  contributed: true
