# Declared contract per raster. verify.verify_raster opens the file and confirms
# REALITY matches this — because filenames and the source sheet lie about units and
# scale (a file the sheet calls "metres" actually held millimetres; a "1-5" layer was
# really 0-4). The schema is the ground truth a file must satisfy before any op uses it.
#
# role: hazard | vulnerability_reclass | raw | risk
# Checked fields (a field is only checked if declared): dtype (exact), valid_min/valid_max
# (sampled range must fall within, with float_tol), nodata, crs (epsg), pixel_size_deg.
# units/scale are carried for provenance and shown in the report; the range check is what
# actually catches a wrong-units declaration.
#
# Measured values come from the file-content verification spike (real reads). Layers marked
# "expected" are confirmed/locked on the first live verify run.

defaults:
  crs: EPSG:4326
  float_tol: 0.0001

# What a role's values mean when they are read back (layer values in a pack): `zero`
# says whether 0 is a reading or "no value"; `scale: nominal` marks class codes that are
# names, not amounts, so nothing averages them. A role not listed counts 0 as a value.
# The L2 engine drops a 0 from its vulnerability inputs (rule R6) and writes 0 where no
# risk was computed. The gate names a contributed vulnerability_* layer's role
# `vulnerability` — the same role as the hand-authored `vulnerability_reclass`.
roles:
  hazard:                {zero: value}    # 0 = outside the hazard: a real reading
  vulnerability_reclass: {zero: nodata}   # 0 = no class
  vulnerability:         {zero: nodata}   # 0 = no class (contributed vulnerability_*)
  risk:                  {zero: nodata}   # 0 = not computed
  landcover:             {zero: nodata, scale: nominal}   # 0 = outside the footprint

layers:
  # --- Layer-2 flood ingredient set (already-reclassed 1-5) ---
  hazard_flood:
    role: hazard
    dtype: int8
    valid_min: 0
    valid_max: 5
    units: class            # 0 = no hazard, 1..5 severity
    scale: 1
    nodata: null
    pixel_size_deg: 0.000898315284120   # ~100 m

  vulnerability_pop_all_total:
    role: vulnerability_reclass
    dtype: uint8
    valid_min: 0
    valid_max: 5            # 0-5 (a coarse 512px sample once under-reported this as 0-4)
    units: class
    scale: 1
    nodata: null

  vulnerability_reclass_blddensity:
    role: vulnerability_reclass
    dtype: int8
    valid_min: 0
    valid_max: 5
    units: class
    scale: 1
    nodata: null

  vulnerability_reclass_road:
    role: vulnerability_reclass
    dtype: int8            # expected — locked on first live verify
    valid_min: 0
    valid_max: 5
    units: class
    scale: 1
    nodata: null

  # --- Validation oracle (Layer 1) ---
  risk_flood:
    role: risk
    dtype: uint8          # expected — locked on first live verify
    valid_min: 0
    valid_max: 5
    units: class
    scale: 1
    nodata: null

  # --- Trap canary: the continuous flood-depth raw layer ---
  # Caught in the spike: uint32, sampled 1..7180 = MILLIMETRES, NOT metres as the sheet says.
  # A "units: metres / valid_max: 5" declaration on this file MUST FAIL verify (S1.T5).
  global_pc_h100glob:
    role: raw
    dtype: uint32
    valid_min: 0
    valid_max: 20000
    units: mm
    scale: 1
    nodata: 0.0

  # --- Expected: reclassed 1-5 class layers (range-checked now; dtype/nodata confirmed on
  #     first live verify). Declared so every reclassed catalog tif has a contract before use. ---
  # hazard
  hazard_cyclone:
    role: hazard
    valid_min: 0
    valid_max: 5
    units: class
  hazard_drought:
    role: hazard
    valid_min: 0
    valid_max: 5
    units: class
  hazard_earthquake:
    role: hazard
    valid_min: 0
    valid_max: 5
    units: class
  hazard_fire:
    role: hazard
    valid_min: 0
    valid_max: 5
    units: class
  hazard_flashflood:
    role: hazard
    valid_min: 0
    valid_max: 5
    units: class
  hazard_landslides:
    role: hazard
    valid_min: 0
    valid_max: 5
    units: class
  hazard_storm:
    role: hazard
    valid_min: 0
    valid_max: 5
    units: class
  hazard_tsunami:
    role: hazard
    valid_min: 0
    valid_max: 5
    units: class
  # risk
  risk_cyclone:
    role: risk
    valid_min: 0
    valid_max: 5
    units: class
  risk_drought:
    role: risk
    valid_min: 0
    valid_max: 5
    units: class
  risk_earthquake:
    role: risk
    valid_min: 0
    valid_max: 5
    units: class
  risk_fire:
    role: risk
    valid_min: 0
    valid_max: 5
    units: class
  risk_flashflood:
    role: risk
    valid_min: 0
    valid_max: 5
    units: class
  risk_landslide:
    role: risk
    valid_min: 0
    valid_max: 5
    units: class
  risk_storm:
    role: risk
    valid_min: 0
    valid_max: 5
    units: class
  risk_tsunami:
    role: risk
    valid_min: 0
    valid_max: 5
    units: class
  # vulnerability_reclass
  vulnerability_F_15_60:
    role: vulnerability_reclass
    valid_min: 0
    valid_max: 5
    units: class
  vulnerability_F_above60:
    role: vulnerability_reclass
    valid_min: 0
    valid_max: 5
    units: class
  vulnerability_F_infant:
    role: vulnerability_reclass
    valid_min: 0
    valid_max: 5
    units: class
  vulnerability_M_15_60:
    role: vulnerability_reclass
    valid_min: 0
    valid_max: 5
    units: class
  vulnerability_M_above60:
    role: vulnerability_reclass
    valid_min: 0
    valid_max: 5
    units: class
  vulnerability_M_infant:
    role: vulnerability_reclass
    valid_min: 0
