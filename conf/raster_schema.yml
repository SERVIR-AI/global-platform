# Declared contract per raster. verify.verify_raster opens the file and confirms
# REALITY matches this — because filenames and the source sheet lie about units and
# scale (a file the sheet calls "metres" actually held millimetres; a "1-5" layer was
# really 0-4). The schema is the ground truth a file must satisfy before any op uses it.
#
# role: hazard | vulnerability_reclass | raw | risk | measure | population | landcover | change
# Checked fields (a field is only checked if declared): dtype (exact), valid_min/valid_max
# (sampled range must fall within, with float_tol), nodata (at the file's float32 precision
# when it is a float: -3.4e38 is the float32 fill -3.3999999521443642e+38), crs (epsg),
# pixel_size_deg.
# The range is of the values AS STORED: a layer's outside values and its nodata are not
# in it. units/scale are carried for provenance and shown in the report; the range check
# is what actually catches a wrong-units declaration. scale_factor/offset (a measure
# stored as scaled integers) turn a stored value into its units when it is read back.
#
# Measured values come from the file-content verification spike (real reads). Layers marked
# "expected" are confirmed/locked on the first live verify run.

defaults:
  crs: EPSG:4326
  float_tol: 0.0001

# What a role's values mean when they are read back (layer values in a pack): `zero`
# says whether 0 is a reading or "no value"; `scale: nominal` marks class codes that are
# names, not amounts, so nothing averages them; `values` says what a cell holds —
# classes (counted as area per class), a count (people per cell) or an amount (a
# continuous measure with units). A role not listed counts 0 as a value.
# The L2 engine drops a 0 from its vulnerability inputs (rule R6) and writes 0 where no
# risk was computed. The gate names a contributed vulnerability_* layer's role
# `vulnerability` — the same role as the hand-authored `vulnerability_reclass`.
roles:
  hazard:                {zero: value, values: classes}    # 0 = outside the hazard: a real reading
  vulnerability_reclass: {zero: nodata, values: classes}   # 0 = no class
  vulnerability:         {zero: nodata, values: classes}   # 0 = no class (contributed vulnerability_*)
  risk:                  {zero: nodata, values: classes}   # 0 = not computed
  landcover:             {zero: nodata, scale: nominal, values: classes}   # 0 = outside the footprint
  change:                {zero: nodata, scale: nominal, values: classes}   # codes name from->to transitions
  population:            {zero: value, values: count}      # 0 = nobody lives there
  measure:               {zero: value, values: amount}     # 0 m, 0 Mg/ha: a reading
  raw:                   {zero: value, values: amount}

# The namespaces a CONTRIBUTED raster may take — the prefix IS the role, and the gate
# (contrib/rasters.py) reads every rule from here: which prefixes exist, what the
# contribution form says of each (`about`), whether a legend is needed, and how a file on
# another CRS is put on EPSG:4326 at ingest (`regrid`): nearest for classes (a class never
# blends), bilinear for an amount (a surface is interpolated), refused for a count (any
# re-gridding moves counts between cells). `classes: [1, 5]` is the class contract every
# hazard/risk reader indexes by; `stack: true` is one year of a land-cover stack.
# `unique_labels: true`: classes compared by code (change between years, a change map's
# from->to) — a legend giving one label to two codes is declined. `fields`: what else a
# layer of the namespace may declare, and what the form says of each; the gate checks
# them, the landed row keeps them, every read of the layer states them. A new kind of
# raster is a row here, not code.
namespaces:
  hazard:        {prefix: hazard_, values: classes, classes: [1, 5], legend: true, regrid: nearest,
                  about: "a hazard map in classes 1-5"}
  risk:          {prefix: risk_, values: classes, classes: [1, 5], legend: true, regrid: nearest,
                  about: "a risk map in classes 1-5"}
  vulnerability: {prefix: vulnerability_, values: classes, classes: [1, 5], legend: true,
                  regrid: nearest,
                  about: "a vulnerability map in classes 1-5, weightable via the 'weights' kind"}
  population:    {prefix: population_, values: count, legend: false, regrid: refuse,
                  about: "a COUNT grid: people per pixel, float; the pack sums it inside each hazard class to report people exposed — no legend"}
  landcover:     {prefix: landcover_, values: classes, legend: true, regrid: nearest, stack: true,
                  unique_labels: true,
                  about: "one year of a land-cover or extent map, named landcover_<stack>_<year>, any class codes with a legend"}
  change:        {prefix: change_, values: classes, legend: true, regrid: nearest,
                  unique_labels: true,
                  fields: {from_year: "for a change_* map: the first year it compares, e.g. 1985",
                           to_year: "for a change_* map: the last year it compares, e.g. 2014",
                           compares: "for a change_* map: the land-cover stack whose maps it compares (landcover_<name>), when there is one"},
                  about: "a CHANGE map between two years, any class codes with a legend naming each from->to class (persistence, gain, loss); never a year of a stack; from_year, to_year and compares say what it compares; read with assemble_pack(layers=[...]) as km² per change class and per class of the land-cover map beside it"}
  measure:       {prefix: measure_, values: amount, legend: false, regrid: bilinear,
                  about: "a continuous value with units — elevation (a DEM), biomass, canopy height, soil carbon, a climate grid; declared.units is required, no legend; read with assemble_pack(layers=[...]) as mean, percentiles and, for a per-area density, a total"}

layers:
  # --- Layer-2 flood ingredient set (already-reclassed 1-5) ---
  hazard_flood:
    role: hazard
    dtype: int8
    valid_min: 0
    valid_max: 5
    units: class            # 0 = no hazard, 1..5 severity
    scale: 1
    nodata: null
    pixel_size_deg: 0.000898315284120   # ~100 m

  vulnerability_pop_all_total:
    role: vulnerability_reclass
    dtype: uint8
    valid_min: 0
    valid_max: 5            # 0-5 (a coarse 512px sample once under-reported this as 0-4)
    units: class
    scale: 1
    nodata: null

  vulnerability_reclass_blddensity:
    role: vulnerability_reclass
    dtype: int8
    valid_min: 0
    valid_max: 5
    units: class
    scale: 1
    nodata: null

  vulnerability_reclass_road:
    role: vulnerability_reclass
    dtype: int8            # expected — locked on first live verify
    valid_min: 0
    valid_max: 5
    units: class
    scale: 1
    nodata: null

  # --- Validation oracle (Layer 1) ---
  risk_flood:
    role: risk
    dtype: uint8          # expected — locked on first live verify
    valid_min: 0
    valid_max: 5
    units: class
    scale: 1
    nodata: null

  # --- Trap canary: the continuous flood-depth raw layer ---
  # Caught in the spike: uint32, sampled 1..7180 = MILLIMETRES, NOT metres as the sheet says.
  # A "units: metres / valid_max: 5" declaration on this file MUST FAIL verify (S1.T5).
  global_pc_h100glob:
    role: raw
    dtype: uint32
    valid_min: 0
    valid_max: 20000
    units: mm
    scale: 1
    nodata: 0.0

  # --- Expected: reclassed 1-5 class layers (range-checked now; dtype/nodata confirmed on
  #     first live verify). Declared so every reclassed catalog tif has a contract before use. ---
