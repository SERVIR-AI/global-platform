# Catalog of tiff files used by the geospatial operations.
# Each raster is loaded from <TIFFS_DIR>/<basename(local_path)> (TIFFS_DIR defaults
# to cache/tiffs/); if it isn't present, it's downloaded once from download_url.

hazard_flood:
  local_path: tiffs/hazard_flood.tif
  download_url: https://drive.google.com/file/d/1s5ZSmFGLDH3i2u74RRq0MBOyawV3Fh34/view?usp=drive_link
  title: 100-year flood hazard (Southeast Asia)
  description: >
    Single-band flood-hazard raster for Southeast Asia. Each pixel holds a flood
    severity class for the 100-year (1% annual probability) flood event: 0 = dry /
    no hazard, 1 = low, up to 5 = extreme. Values are a hazard class, NOT water
    depth in metres. The geospatial operations sample this raster per location
    (point) or per road segment to decide what is "in the flood".
  legend:
    1: Very Low (0-0.5 m)
    2: Low (0.5-1 m)
    3: Moderate (1-1.5 m)
    4: High (1.5-2 m)
    5: Very High (>2 m)
  source: ADPC hazard_flood.tif, derived from JRC GLOFAS v2.1
  band:
    1:
      name: flood_class
      dtype: Int8
      values: 0 (dry) .. 5 (extreme) flood severity
  crs: EPSG:4326 (WGS 84, lon/lat in degrees)
  size: { width: 54691, height: 44335 }
  pixel_size_deg: 0.000898315284120  # ~100 m at the equator
  layout: COG (Cloud-Optimized GeoTIFF), LZW-compressed, with overviews
  extent:
    # Cities outside this window return an error rather than a wrong answer.
    lon: [92.0270110, 141.1567722]   # ~92E .. 141E
    lat: [-11.1436011, 28.6832070]   # ~11S .. 29N
  notes:
    - Severity is a 1-5 class, not depth in metres.
    - ~100 m resolution: accurate in aggregate, coarse at individual flood edges.
    - The raster is itself a model output, not an observed flood.

hazard_flashflood:
  local_path: tiffs/hazard_flashflood.tif
  download_url: https://drive.google.com/file/d/1l88oCDFxkJgcO5Bzp8MkhYBtUblo06yK/view
  title: Flash-flood hazard (Southeast Asia)
  description: >
    Flash-flood hazard severity class (0 none .. 5 extreme) for Southeast Asia:
    sudden, localized flooding from intense rainfall, distinct from the riverine
    100-year flood layer. Sampled per location/road segment.
  legend: { 1: Very Low, 2: Low, 3: Moderate, 4: High, 5: Very High }

hazard_drought:
  local_path: tiffs/hazard_drought.tif
  download_url: https://drive.google.com/file/d/1T5JDp2gkavG79yNFds-1w9gJs3-j6n7G/view
  title: Drought hazard (Southeast Asia)
  description: >
    Drought hazard severity class (0 none .. 5 extreme) for Southeast Asia
    (rainfall-deficit / dryness). Coarse resolution; a class, not a rainfall value.
  legend: { 1: Very Low, 2: Low, 3: Moderate, 4: High, 5: Very High }

hazard_fire:
  local_path: tiffs/hazard_fire.tif
  download_url: https://drive.google.com/file/d/1n-7VtJKPUN1bfl6TB0a9cvixkC-V8w7b/view
  title: Wildfire hazard (Southeast Asia)
  description: >
    Wildfire hazard severity class (0 none .. 5 extreme) for Southeast Asia.
  legend: { 1: Very Low, 2: Low, 3: Moderate, 4: High, 5: Very High }

hazard_landslides:
  local_path: tiffs/hazard_landslides.tif
  download_url: https://drive.google.com/file/d/1A4AgHZuFI86BNAU92vokb1ZFQZuexCcb/view
  title: Landslide hazard (Southeast Asia)
  description: >
    Landslide hazard severity class (0 none .. 5 extreme) for Southeast Asia
    (slope-failure susceptibility). Choose for "landslide" / "slope" questions.
  legend: { 1: Very Low, 2: Low, 3: Moderate, 4: High, 5: Very High }

hazard_cyclone:
  local_path: tiffs/hazard_cyclone.tif
  download_url: https://drive.google.com/file/d/1NNXdl7ZOwYLf08lii149M7eC0QaborAa/view
  title: Tropical cyclone wind hazard (Southeast Asia)
  description: >
    Tropical-cyclone wind hazard class (0 none .. 5 extreme) for Southeast Asia,
    by sustained wind-speed band. Choose for "cyclone" / "typhoon" / "wind" questions.
  legend:
    1: Very Low (<=61 km/h)
    2: Low (62-88 km/h)
    3: Moderate (89-117 km/h)
    4: High (118-156 km/h)
    5: Very High (>=157 km/h)

hazard_storm:
  local_path: tiffs/hazard_storm.tif
  download_url: https://drive.google.com/file/d/1BwEMxKze9XwXZL9n-KS5IX867ErRO9Qz/view
  title: Storm hazard (Southeast Asia)
  description: >
    Convective-storm hazard severity class (0 none .. 5 extreme) for Southeast Asia.
  legend: { 1: Very Low, 2: Low, 3: Moderate, 4: High, 5: Very High }

hazard_tsunami:
  local_path: tiffs/hazard_tsunami.tif
  download_url: https://drive.google.com/file/d/19kb42dkl4U1BlO8K_NTaPFw5BpxMFbMw/view
  title: Tsunami hazard (Southeast Asia)
  description: >
    Tsunami hazard severity class (0 none .. 5 extreme) for Southeast Asia coasts
    (inundation potential). Choose for "tsunami" questions; coastal places only.
  legend: { 1: Very Low, 2: Low, 3: Moderate, 4: High, 5: Very High }

hazard_earthquake:
  local_path: tiffs/hazard_earthquake.tif
  download_url: https://drive.google.com/file/d/1ZoQYtROUxf_YVzj1BgCRNFsqSWALpBxZ/view
  title: Earthquake hazard (Southeast Asia)
  description: >
    Earthquake hazard class (0 none .. 5 extreme) for Southeast Asia by peak ground
    acceleration (PGA, 250-year return). Choose for "earthquake" / "seismic" questions.
  legend:
    1: Very Low (<25 PGA)
    2: Low (25-50 PGA)
    3: Moderate (50-150 PGA)
    4: High (150-300 PGA)
    5: Very High (>300 PGA)

# --- Computed (not downloaded): Layer-2 risk, built per-AOI by combine.combine_l2 ---
risk_flood_l2:
  local_path: tiffs/risk_flood_l2.tif
  computed: true
  internal: true
  title: Computed flood risk (Layer 2)
  description: >
    Computed flood RISK = Hazard x weighted Vulnerability (class 1-5), built on the fly
    from the reclassed flood-hazard and vulnerability layers. Choose this when the user
    asks about flood RISK (who/what is at risk); NOT for raw flood exposure / "flooded"
    (use hazard_flood for those). 0 = no risk, 1 low .. 5 very high.
  legend:
    1: Very Low
    2: Low
    3: Moderate
    4: High
    5: Very High

# --- Internal: the precomputed (Layer-1) risk, offered via the L1/L2 question, NOT the router menu ---
risk_flood:
  local_path: tiffs/risk_flood.tif
  internal: true
  title: Precomputed flood risk (Layer 1, ADPC)
  description: >
    ADPC's precomputed flood RISK (class 1-5) — the official reference map. Used for the
    Layer-1 path (sample the precomputed risk). The agent offers this through the L1/L2
    question, so it is hidden from the router menu.
  legend:
    1: Very Low
    2: Low
    3: Moderate
    4: High
    5: Very High

# ---------------------------------------------------------------------------
# LAND-COVER STACKS — one legend, one contract, one file per year. A `kind: stack`
# row is expanded by tiffs.catalog() into one internal row per year
# (landcover_hkh_2022, ...); the contract lives once under `stacks:` in
# conf/raster_schema.yml. `data_root` is a directory of the files or a zip whose
# entries are STORED (read in place through GDAL's /vsizip/); the environment
# variable in `data_root_env` overrides it per machine. Relative roots resolve
# against the repo root.
landcover_hkh:
  kind: stack
  role: landcover
  internal: true
  title: HKH land cover 2000-2022 (ICIMOD RLCMS, 30 m, 9 classes)
  description: >
    Annual land-cover maps of the Hindu Kush Himalaya from ICIMOD's Regional Land
    Cover Monitoring System: one categorical 30 m raster per year, 2000-2022 except
    2012, classes 1-9. Pixel value 0 (2000-2019 files) and the nodata value 15
    (2020-2022 files) both mean outside the product footprint or unclassified.
    Not a hazard layer: the land-cover pack counts its classes inside an area.
  source: "ICIMOD (2022). Land cover of HKH region [Data set]. ICIMOD. https://doi.org/10.26066/RDS.1972511"
  url: https://doi.org/10.26066/RDS.1972511
  pub_date: "2022-11-09"
  vintage: 2022-11
  license: CC-BY-4.0
  authority: regional hub product (ICIMOD, SERVIR-HKH), co-developed with national agencies; no national land-cover map is registered on this platform
  accuracy: unstated
  legend:
    1: Water body
    2: Snow and glacier
    3: Forest
    4: Riverbed
    5: Built-up area
    6: Cropland
    7: Bare soil
    8: Bare rock
    9: Grassland
  outside_values: [0, 15]
  countries: [Afghanistan, Pakistan, India, Nepal, Bhutan, Bangladesh, Myanmar, China]   # the HKH footprint; read by the pack's "where"
  years: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011,
          2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022]
  missing_years:
    2012: no map published by the producer
  extent:
    lon: [50.08, 109.38]
    lat: [10.54, 43.21]
  colors:                      # map legend; the panel and embed paint classes with these
    1: "#4f8fd6"
    2: "#cfe3f5"
    3: "#2e7d32"
    4: "#c9b27c"
    5: "#d64545"
    6: "#e6c84a"
    7: "#b07b4f"
    8: "#8c8c8c"
    9: "#9bcb6b"
  layer_pattern: landcover_hkh_{year}
  file_pattern: RLCMS/hkh_lc-{year}.tif
  data_root: landcover/OneDrive_2_10-6-2026.zip
  data_root_env: LANDCOVER_HKH_ROOT
  # Point sets that ride this stack. The shapefile is converted once into a compact
  # platform-owned file under cache/vectors/ (python -m app.land_cover.fire build);
  # until then the pack declares the layer as registered but not built.
  points:
    hkh_fire:
      title: MODIS active-fire detections over the HKH, 2001-2025 (NASA FIRMS, processed by ICIMOD)
      source: "NASA FIRMS MODIS Collection 6 active-fire detections (Terra and Aqua), each stamped by ICIMOD's forest-fire system with the 2022 RLCMS land-cover class at the detection point"
      license: NASA FIRMS data are free and open (acknowledgement requested); the stamped class follows the stack's CC-BY-4.0
      file_pattern: ForestFire/hkh_fire
      derived: hkh_fire_points.npz
