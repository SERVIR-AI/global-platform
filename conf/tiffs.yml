# Catalog of tiff files used by the geospatial operations.
# Each raster is loaded from <TIFFS_DIR>/<basename(local_path)> (TIFFS_DIR defaults
# to cache/tiffs/); if it isn't present, it's downloaded once from download_url.

hazard_flood:
  local_path: tiffs/hazard_flood.tif
  download_url: https://drive.google.com/file/d/1s5ZSmFGLDH3i2u74RRq0MBOyawV3Fh34/view?usp=drive_link
  title: 100-year flood hazard (Southeast Asia)
  description: >
    Single-band flood-hazard raster for Southeast Asia. Each pixel holds a flood
    severity class for the 100-year (1% annual probability) flood event: 0 = dry /
    no hazard, 1 = low, up to 5 = extreme. Values are a hazard class, NOT water
    depth in metres. The geospatial operations sample this raster per location
    (point) or per road segment to decide what is "in the flood".
  legend:
    1: Very Low (0-0.5 m)
    2: Low (0.5-1 m)
    3: Moderate (1-1.5 m)
    4: High (1.5-2 m)
    5: Very High (>2 m)
  source: ADPC hazard_flood.tif, derived from JRC GLOFAS v2.1
  band:
    1:
      name: flood_class
      dtype: Int8
      values: 0 (dry) .. 5 (extreme) flood severity
  crs: EPSG:4326 (WGS 84, lon/lat in degrees)
  size: { width: 54691, height: 44335 }
  pixel_size_deg: 0.000898315284120  # ~100 m at the equator
  layout: COG (Cloud-Optimized GeoTIFF), LZW-compressed, with overviews
  extent:
    # Cities outside this window return an error rather than a wrong answer.
    lon: [92.0270110, 141.1567722]   # ~92E .. 141E
    lat: [-11.1436011, 28.6832070]   # ~11S .. 29N
  notes:
    - Severity is a 1-5 class, not depth in metres.
    - ~100 m resolution: accurate in aggregate, coarse at individual flood edges.
    - The raster is itself a model output, not an observed flood.

hazard_flashflood:
  local_path: tiffs/hazard_flashflood.tif
  download_url: https://drive.google.com/file/d/1l88oCDFxkJgcO5Bzp8MkhYBtUblo06yK/view
  title: Flash-flood hazard (Southeast Asia)
  description: >
    Flash-flood hazard severity class (0 none .. 5 extreme) for Southeast Asia:
    sudden, localized flooding from intense rainfall, distinct from the riverine
    100-year flood layer. Sampled per location/road segment.
  legend: { 1: Very Low, 2: Low, 3: Moderate, 4: High, 5: Very High }

